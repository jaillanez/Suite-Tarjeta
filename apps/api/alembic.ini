# Configuración de Alembic. La URL NO se define acá: env.py la toma de la
# configuración (rol tarjeta_migrator, database_migrator_url).
[alembic]
script_location = src/tarjeta/migrations
prepend_sys_path = src
path_separator = os
timezone = America/Argentina/San_Juan

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
