[project]
name = "tarjeta-api"
version = "0.1.0"
description = "Backend de la Tarjeta de Beneficios Municipal"
requires-python = "==3.14.7"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy[asyncio]==2.0.52",
    "psycopg[binary,pool]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "alembic==1.19.1",
    "redis==8.1.0",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "pyjwt==2.13.0",
    "cryptography==50.0.1",
    "reportlab==5.0.1",
    "geoalchemy2==0.19.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "import-linter",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarjeta"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

# ------------------------------------------------------------------ mypy
# Estricto sobre domain y application (se ejecuta apuntando a esas rutas).
[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
plugins = []

# reportlab no publica type stubs; se usa solo para generar el PDF del QR (§06.3).
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requiere una base PostgreSQL real (service container en CI)",
]

# ------------------------------------------------------------------ import-linter
[tool.importlinter]
root_packages = ["tarjeta"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El dominio no depende de nada"
type = "forbidden"
source_modules = [
    "tarjeta.modules.*.domain",
    "tarjeta.shared.domain",
]
forbidden_modules = ["sqlalchemy", "fastapi", "pydantic", "httpx"]

[[tool.importlinter.contracts]]
name = "Capas en orden"
type = "layers"
layers = ["api", "application", "domain"]
containers = [
    "tarjeta.modules.identidad",
    "tarjeta.modules.padron",
    "tarjeta.modules.ciudadania",
    "tarjeta.modules.comercios",
    "tarjeta.modules.promociones",
    "tarjeta.modules.canje",
    "tarjeta.modules.puntos",
    "tarjeta.modules.grupo",
    "tarjeta.modules.contenido",
    "tarjeta.modules.difusion",
    "tarjeta.modules.notificaciones",
    "tarjeta.modules.antifraude",
    "tarjeta.modules.captacion",
    "tarjeta.modules.gobierno",
    "tarjeta.modules.comercios",
]

[[tool.importlinter.contracts]]
name = "Los modulos no se importan entre si"
type = "independence"
modules = [
    "tarjeta.modules.identidad",
    "tarjeta.modules.padron",
    "tarjeta.modules.ciudadania",
    "tarjeta.modules.comercios",
    "tarjeta.modules.promociones",
    "tarjeta.modules.canje",
    "tarjeta.modules.puntos",
    "tarjeta.modules.grupo",
    "tarjeta.modules.contenido",
    "tarjeta.modules.difusion",
    "tarjeta.modules.notificaciones",
    "tarjeta.modules.antifraude",
    "tarjeta.modules.captacion",
    "tarjeta.modules.gobierno",
    "tarjeta.modules.comercios",
]
