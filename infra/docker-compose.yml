# Desarrollo local.
# Camino elegido: A (PostgreSQL nativo de Homebrew) + Redis nativo de Homebrew.
# Este compose queda disponible para el camino B / CI:
#   - PostgreSQL solo se levanta con:  docker compose --profile db up -d
#   - Redis:                            docker compose up -d redis
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: tarjeta
      POSTGRES_PASSWORD: tarjeta_dev
      POSTGRES_DB: tarjeta
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-AR"
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    profiles: ["db"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarjeta -d tarjeta"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
