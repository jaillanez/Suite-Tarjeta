name: ci

# Se dispara siempre (sin filtro de paths en el trigger). El job `changes` decide
# qué áreas corren; `ci-ok` agrega el resultado y es el único check obligatorio.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      codigo: ${{ steps.filter.outputs.codigo }}
      estado: ${{ steps.filter.outputs.estado }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'apps/mobile/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            # Código funcional: si cambia, la matriz de estado debe reflejarlo (gate docs_al_dia).
            codigo:
              - 'apps/api/src/**'
              - 'apps/web/src/**'
              - 'apps/web/middleware.ts'
              - 'apps/mobile/src/**'
              - 'packages/*/src/**'
            estado:
              - 'docs/estado-funcional.md'

  api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      TARJETA_ENVIRONMENT: dev
      # runtime = rol tarjeta_app (sin DDL); migrador/dueño = rol tarjeta. Dos roles como en prod.
      TARJETA_DATABASE_URL: postgresql+psycopg://tarjeta_app:tarjeta_app@localhost:5432/tarjeta_test
      TARJETA_DATABASE_MIGRATOR_URL: postgresql+psycopg://tarjeta:tarjeta@localhost:5432/tarjeta_test
      TARJETA_INTEGRATION_DATABASE_URL: postgresql+psycopg://tarjeta_app:tarjeta_app@localhost:5432/tarjeta_test
      TARJETA_REDIS_URL: redis://localhost:6379/0
      TARJETA_PADRON_BASE_URL: http://localhost:9999/padron
      TARJETA_PADRON_API_KEY: ci-dummy-key
      TARJETA_JWT_SECRET: ci-insecure-secret-change-me-32bytes-minimo
      TARJETA_FIELD_PEPPER: ci-dummy-pepper-para-hmac-de-busqueda
      TARJETA_FIELD_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: tarjeta
          POSTGRES_PASSWORD: tarjeta
          POSTGRES_DB: tarjeta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tarjeta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar Python 3.14.7
        run: uv python install 3.14.7
      - name: Instalar dependencias (lock congelado)
        run: uv sync --group dev --frozen
      - name: Crear extensiones en la base de test
        run: PGPASSWORD=tarjeta psql -h localhost -U tarjeta -d tarjeta_test -f "$GITHUB_WORKSPACE/infra/sql/00-extensions.sql"
      - name: Crear rol de runtime (tarjeta_app) y default privileges
        run: PGPASSWORD=tarjeta psql -h localhost -U tarjeta -d tarjeta_test -f "$GITHUB_WORKSPACE/infra/sql/01-roles.sql"
      - name: ruff check
        if: ${{ !cancelled() }}
        run: uv run ruff check .
      - name: ruff format --check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .
      - name: mypy
        if: ${{ !cancelled() }}
        run: uv run mypy src
      - name: import-linter
        if: ${{ !cancelled() }}
        run: uv run lint-imports
      - name: Migraciones (alembic upgrade head)
        if: ${{ !cancelled() }}
        run: uv run alembic upgrade head
      - name: Tests + cobertura
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest -v
          --cov=src/tarjeta/modules/identidad
          --cov=src/tarjeta/modules/padron
          --cov=src/tarjeta/modules/ciudadania
          --cov=src/tarjeta/modules/gobierno
          --cov=src/tarjeta/modules/comercios
          --cov=src/tarjeta/modules/promociones
          --cov=src/tarjeta/modules/canje
          --cov=src/tarjeta/modules/puntos
          --cov=src/tarjeta/modules/grupo
          --cov=src/tarjeta/modules/contenido
          --cov-report=term-missing --cov-report=json
      - name: Gate de cobertura por módulo (>=85%)
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open("coverage.json"))
          mods = ("identidad", "padron", "ciudadania", "gobierno", "comercios", "promociones", "canje", "puntos", "grupo", "contenido")
          agg = {m: [0, 0] for m in mods}
          for path, info in data["files"].items():
              for m in mods:
                  if f"/modules/{m}/" in path.replace("\\", "/"):
                      s = info["summary"]
                      agg[m][0] += s["covered_lines"]
                      agg[m][1] += s["num_statements"]
          fallo = False
          for m, (cov, tot) in agg.items():
              pct = 100.0 * cov / tot if tot else 100.0
              print(f"{m}: {pct:.1f}%")
              if pct < 85:
                  print(f"::error::Cobertura de {m} por debajo de 85% ({pct:.1f}%)")
                  fallo = True
          sys.exit(1 if fallo else 0)
          PY
      - name: El test de integración NO debe saltearse en CI
        if: ${{ !cancelled() }}
        run: |
          out=$(uv run pytest -m integration -rs -q 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -qiE "skipped"; then
            echo "::error::El test de integración se salteó en CI"; exit 1
          fi
          if ! echo "$out" | grep -qE "[0-9]+ passed"; then
            echo "::error::No corrió ningún test de integración"; exit 1
          fi
      - name: Publicar cobertura en el resumen
        if: ${{ !cancelled() }}
        run: |
          pct=$(python3 -c "import json;print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "### Cobertura backend (identidad+padron+ciudadania+gobierno+comercios+promociones+canje+puntos+grupo+contenido): ${pct}%" >> "$GITHUB_STEP_SUMMARY"
      - name: Cliente de API — openapi.json al día (§06.0.A)
        if: ${{ !cancelled() }}
        run: |
          uv run python -m tarjeta.scripts.dump_openapi
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet -- packages/api-client/openapi.json; then
            echo "::error::openapi.json desactualizado: corré 'uv run python -m tarjeta.scripts.dump_openapi' y commiteá."
            git -C "$GITHUB_WORKSPACE" --no-pager diff -- packages/api-client/openapi.json | head -80
            exit 1
          fi

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: pnpm
      - name: Instalar dependencias (lock congelado)
        run: pnpm install --frozen-lockfile
      - name: Cliente de API — schema.generated.ts al día (§06.0.A)
        run: |
          pnpm --filter @tarjeta/api-client generate
          if ! git diff --quiet -- packages/api-client/src/schema.generated.ts; then
            echo "::error::schema.generated.ts desactualizado: corré 'pnpm generate:api' y commiteá."
            git --no-pager diff -- packages/api-client/src/schema.generated.ts | head -80
            exit 1
          fi
      - name: Lint
        run: pnpm lint
      - name: Tests (vitest)
        run: pnpm test
      - name: Build web
        run: pnpm --filter @tarjeta/web build
      - name: Build mobile (export estático)
        run: pnpm --filter @tarjeta/mobile build
      - name: Typecheck
        run: pnpm typecheck

  # Criterio de aceptación (como el lint o la cobertura): si cambia código funcional, la matriz de
  # estado debe cambiar en el mismo PR. Escape: una línea `docs-al-dia: n/a — <razón>` en el cuerpo.
  docs_al_dia:
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: docs/estado-funcional.md al día
        env:
          CODIGO: ${{ needs.changes.outputs.codigo }}
          ESTADO: ${{ needs.changes.outputs.estado }}
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          if [ "$CODIGO" != "true" ]; then
            echo "Sin cambios de código funcional: no aplica."; exit 0
          fi
          if [ "$ESTADO" = "true" ]; then
            echo "docs/estado-funcional.md actualizado en el PR."; exit 0
          fi
          if printf '%s' "$CUERPO" | grep -qiE '^[[:space:]]*docs-al-dia:[[:space:]]*(n/a|no aplica)'; then
            echo "Opt-out declarado en la descripción del PR."; exit 0
          fi
          echo "::error::Cambió código funcional pero no docs/estado-funcional.md. Actualizá la matriz (y docs/lista-para-lanzar.md si cambió el estado de lanzamiento), o poné en la descripción del PR una línea 'docs-al-dia: n/a — <razón>'."
          exit 1

  ci-ok:
    needs: [changes, api, web, docs_al_dia]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados de los jobs
        run: |
          echo "changes=${{ needs.changes.result }} api=${{ needs.api.result }} web=${{ needs.web.result }} docs_al_dia=${{ needs.docs_al_dia.result }}"
          for r in "${{ needs.changes.result }}" "${{ needs.api.result }}" "${{ needs.web.result }}" "${{ needs.docs_al_dia.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Un job del CI falló o fue cancelado"; exit 1
            fi
          done
          echo "CI OK"
