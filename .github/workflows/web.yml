name: web

# Estructura mínima. Los comandos reales (install, lint, typecheck, build) se agregan
# en el PASO 02, cuando existan apps/web y apps/mobile.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Placeholder
        run: echo "El pipeline web se completa en el PASO 02 (pnpm install, lint, typecheck, build)."
